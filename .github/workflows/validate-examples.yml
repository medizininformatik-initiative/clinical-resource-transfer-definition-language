name: Validate CRTDL Examples

on:
  push:
    paths:
      - 'example-json/**'
      - 'json-schema/**'
      - 'scripts/validate_crtdl.py'
      - 'requirements.txt'
      - '.github/workflows/validate-examples.yml'
  pull_request:
    paths:
      - 'example-json/**'
      - 'json-schema/**'
      - 'scripts/validate_crtdl.py'
      - 'requirements.txt'
      - '.github/workflows/validate-examples.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate example CRTDL documents
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Valid examples must pass validation
        run: python3 scripts/validate_crtdl.py example-json/*.json

      - name: Invalid examples must each fail validation
        run: |
          set -e
          failed=0
          for f in example-json/invalid/*.json; do
            if python3 scripts/validate_crtdl.py "$f" > /dev/null; then
              echo "::error file=$f::expected validation to fail, but it passed"
              failed=1
            else
              echo "OK (expected failure): $f"
            fi
          done
          exit $failed
